<rect x="20" y="360" width="260" height="70" rx="8" ry="8" fill="#fff8e7" stroke="#333" stroke-width="1.5"/><text x="150.0" y="388.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="150.0" dy="0">A1 ASM-power/FOV</tspan><tspan x="150.0" dy="1.25em">(R-S02-1-A1)</tspan></text>
