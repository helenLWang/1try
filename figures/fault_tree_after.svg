<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="740" viewBox="0 0 1460 740">
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111">Fault tree 2 — after system-level mitigations M1 and M2</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Top event = violation of REQ R-S02-1 (world). Intermediate events = ASM or SPEC failures. Circles: OR / AND gates.</text>
  <rect x="380" y="60" width="700" height="70" rx="8" ry="8" fill="#f8d0d0" stroke="#333" stroke-width="2"/><text x="730.0" y="88.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><tspan x="730.0" dy="0">TOP: Coordinating LE does not learn of a true in-view sighting</tspan><tspan x="730.0" dy="1.25em">while the child is still nearby  (R-S02-1) — after M1 and M2</tspan></text>
