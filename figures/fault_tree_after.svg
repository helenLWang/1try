<line x1="1020" y1="340" x2="1010" y2="445" stroke="#333" stroke-width="1.4"/>
<circle cx="1310" cy="322" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="1310" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<rect x="1170" y="360" width="270" height="70" rx="8" ry="8" fill="#fff3cd" stroke="#333" stroke-width="1.5"/><text x="1305.0" y="388.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="1305.0" dy="0">E1 Reviewer shift empty</tspan><tspan x="1305.0" dy="1.25em">(volunteer ASM)</tspan></text>
<rect x="1170" y="445" width="270" height="78" rx="8" ry="8" fill="#fff3cd" stroke="#333" stroke-width="1.5"/><text x="1305.0" y="470.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="1305.0" dy="0">E2 Top-k cap already full;</tspan><tspan x="1305.0" dy="1.25em">crop counted as overflow</tspan><tspan x="1305.0" dy="1.25em">not shown</tspan></text>
<line x1="1310" y1="340" x2="1305" y2="360" stroke="#333" stroke-width="1.4"/>
<line x1="1310" y1="340" x2="1305" y2="445" stroke="#333" stroke-width="1.4"/>
<rect x="20" y="640" width="1420" height="72" rx="8" ry="8" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/><text x="730.0" y="662.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222"><tspan x="730.0" dy="0">M1 (system, not ML): delay-tolerant multi-path delivery (phone + Wi-Fi/USB + encrypted kiosk offload) + retro-match of retained loop after a late search-alert.</tspan><tspan x="730.0" dy="1.25em">M2 (system, not ML): top-k stills + clothing tags to a reviewer, independent of the face threshold — so B2 alone is no longer a cut set.</tspan><tspan x="730.0" dy="1.25em">Effect: former singleton cut sets {B2} and {C1} become larger AND-combinations. Residual risk moves to reviewer capacity (E) and kiosk routing (C1c).</tspan></text>
</svg>
