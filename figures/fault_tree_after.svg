<circle cx="440" cy="322" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="440" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">AND</text>
<rect x="300" y="360" width="280" height="78" rx="8" ry="8" fill="#fde2e2" stroke="#333" stroke-width="2.2"/><text x="440.0" y="385.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="440.0" dy="0">B2 SPEC-ML wrong prediction</tspan><tspan x="440.0" dy="1.25em">face score too low / wrong</tspan><tspan x="440.0" dy="1.25em">(R-S02-1-P2)  ★ still present</tspan></text>
<rect x="300" y="450" width="280" height="70" rx="8" ry="8" fill="#fff3cd" stroke="#333" stroke-width="1.5"/><text x="440.0" y="478.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="440.0" dy="0">M2 residual: clothing/color cue</tspan><tspan x="440.0" dy="1.25em">also fails to keep the crop</tspan></text>
<rect x="300" y="532" width="280" height="78" rx="8" ry="8" fill="#fff8e7" stroke="#333" stroke-width="1.5"/><text x="440.0" y="557.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="440.0" dy="0">AND (B1 SPEC-alert missing</tspan><tspan x="440.0" dy="1.25em">OR B3 ASM-photo stale)</tspan><tspan x="440.0" dy="1.25em">— still can starve matching</tspan></text>
