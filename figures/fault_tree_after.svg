<rect x="590" y="360" width="280" height="70" rx="8" ry="8" fill="#fff8e7" stroke="#333" stroke-width="1.5"/><text x="730.0" y="388.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="730.0" dy="0">C1a Phone Bluetooth/cellular</tspan><tspan x="730.0" dy="1.25em">path fails in time</tspan></text>
<rect x="590" y="440" width="280" height="70" rx="8" ry="8" fill="#fff8e7" stroke="#333" stroke-width="1.5"/><text x="730.0" y="468.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="730.0" dy="0">C1b Wi-Fi / USB home/work</tspan><tspan x="730.0" dy="1.25em">offload also fails</tspan></text>
<rect x="590" y="520" width="280" height="78" rx="8" ry="8" fill="#fff3cd" stroke="#333" stroke-width="1.5"/><text x="730.0" y="545.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="730.0" dy="0">C1c No partner kiosk visit</tspan><tspan x="730.0" dy="1.25em">before child leaves area</tspan><tspan x="730.0" dy="1.25em">(M1 residual)</tspan></text>
<line x1="730" y1="340" x2="730" y2="360" stroke="#333" stroke-width="1.4"/>
<line x1="730" y1="340" x2="730" y2="440" stroke="#333" stroke-width="1.4"/>
<line x1="730" y1="340" x2="730" y2="520" stroke="#333" stroke-width="1.4"/>
