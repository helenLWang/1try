<circle cx="730" cy="178" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="730" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<line x1="730" y1="196" x2="150" y2="230" stroke="#333" stroke-width="1.4"/>
<rect x="20" y="230" width="260" height="56" rx="8" ry="8" fill="#ffe6c7" stroke="#333" stroke-width="1.5"/><text x="150.0" y="251.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="150.0" dy="0">A. Never captured</tspan><tspan x="150.0" dy="1.25em">(unchanged physical ASMs)</tspan></text>
<line x1="150" y1="286" x2="150" y2="304" stroke="#333" stroke-width="1.4"/>
