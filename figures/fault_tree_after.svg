<rect x="880" y="360" width="260" height="70" rx="8" ry="8" fill="#fff8e7" stroke="#333" stroke-width="1.5"/><text x="1010.0" y="388.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="1010.0" dy="0">D1 SPEC-inbox drop</tspan><tspan x="1010.0" dy="1.25em">(R-S02-1-P5)</tspan></text>
<rect x="880" y="445" width="260" height="78" rx="8" ry="8" fill="#fff8e7" stroke="#333" stroke-width="1.5"/><text x="1010.0" y="470.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="1010.0" dy="0">D2 ASM-operator ignore</tspan><tspan x="1010.0" dy="1.25em">(R-S02-1-A5) — M2 can</tspan><tspan x="1010.0" dy="1.25em">increase volume; still a risk</tspan></text>
