<rect x="600" y="230" width="260" height="56" rx="8" ry="8" fill="#d8f3dc" stroke="#333" stroke-width="1.5"/><text x="730.0" y="251.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="730.0" dy="0">C*. All delivery paths fail</tspan><tspan x="730.0" dy="1.25em">before the child leaves</tspan></text>
