<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="790" viewBox="0 0 1460 790">
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111">Fault tree 1 — before mitigations (REQ R-S02-1)</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Top event = violation of REQ R-S02-1 (world). Intermediate events = ASM or SPEC failures. Circles: OR / AND gates.</text>
  <rect x="430" y="70" width="500" height="70" rx="8" ry="8" fill="#f8d0d0" stroke="#333" stroke-width="2"/><text x="680.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><tspan x="680.0" dy="0">TOP: Coordinating LE does not learn of a true</tspan><tspan x="680.0" dy="1.25em">in-view sighting while the child is still nearby</tspan><tspan x="680.0" dy="1.25em">(violation of REQ R-S02-1)</tspan></text>
<line x1="680" y1="140" x2="680" y2="175" stroke="#333" stroke-width="1.4"/>
<circle cx="680" cy="193" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="680" y="197" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<line x1="680" y1="211" x2="180" y2="250" stroke="#333" stroke-width="1.4"/>
<rect x="20" y="250" width="320" height="56" rx="8" ry="8" fill="#ffe6c7" stroke="#333" stroke-width="1.5"/><text x="180.0" y="271.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222"><tspan x="180.0" dy="0">A. Child never captured</tspan><tspan x="180.0" dy="1.25em">in recorded video</tspan></text>
<line x1="180" y1="306" x2="180" y2="328" stroke="#333" stroke-width="1.4"/>
<circle cx="180" cy="346" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="180" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<line x1="680" y1="211" x2="540" y2="250" stroke="#333" stroke-width="1.4"/>
<rect x="380" y="250" width="320" height="56" rx="8" ry="8" fill="#ffe6c7" stroke="#333" stroke-width="1.5"/><text x="540.0" y="271.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222"><tspan x="540.0" dy="0">B. Captured, but software</tspan><tspan x="540.0" dy="1.25em">emits no match output</tspan></text>
<line x1="540" y1="306" x2="540" y2="328" stroke="#333" stroke-width="1.4"/>
<circle cx="540" cy="346" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="540" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<line x1="680" y1="211" x2="900" y2="250" stroke="#333" stroke-width="1.4"/>
<rect x="740" y="250" width="320" height="56" rx="8" ry="8" fill="#ffe6c7" stroke="#333" stroke-width="1.5"/><text x="900.0" y="271.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222"><tspan x="900.0" dy="0">C. Match exists, report not</tspan><tspan x="900.0" dy="1.25em">delivered in useful time</tspan></text>
<line x1="900" y1="306" x2="900" y2="328" stroke="#333" stroke-width="1.4"/>
<circle cx="900" cy="346" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="900" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<line x1="680" y1="211" x2="1260" y2="250" stroke="#333" stroke-width="1.4"/>
<rect x="1100" y="250" width="320" height="56" rx="8" ry="8" fill="#ffe6c7" stroke="#333" stroke-width="1.5"/><text x="1260.0" y="271.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222"><tspan x="1260.0" dy="0">D. Report arrives but is</tspan><tspan x="1260.0" dy="1.25em">not treated as a sighting</tspan></text>
<line x1="1260" y1="306" x2="1260" y2="328" stroke="#333" stroke-width="1.4"/>
<circle cx="1260" cy="346" r="18" fill="#e8eef7" stroke="#333" stroke-width="1.5"/><text x="1260" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold">OR</text>
<rect x="20" y="380" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="180.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="180.0" dy="0">A1 ASM-power/FOV</tspan><tspan x="180.0" dy="1.25em">Dashcam unpowered or</tspan><tspan x="180.0" dy="1.25em">lens blocked/dirty</tspan><tspan x="180.0" dy="1.25em">(R-S02-1-A1)</tspan></text>
<line x1="180" y1="364" x2="180" y2="380" stroke="#333" stroke-width="1.4"/>
<rect x="20" y="490" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="180.0" y="515.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="180.0" dy="0">A2 ASM-occlusion</tspan><tspan x="180.0" dy="1.25em">Face/clothing covered</tspan><tspan x="180.0" dy="1.25em">entire time in view</tspan><tspan x="180.0" dy="1.25em">(R-S02-1-A2)</tspan></text>
<line x1="180" y1="364" x2="180" y2="490" stroke="#333" stroke-width="1.4"/>
<rect x="380" y="380" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="540.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="540.0" dy="0">B1 SPEC-alert</tspan><tspan x="540.0" dy="1.25em">Search-alert never stored</tspan><tspan x="540.0" dy="1.25em">on device / phone</tspan><tspan x="540.0" dy="1.25em">(R-S02-1-P1)</tspan></text>
<line x1="540" y1="364" x2="540" y2="380" stroke="#333" stroke-width="1.4"/>
<rect x="380" y="490" width="320" height="92" rx="8" ry="8" fill="#fde2e2" stroke="#333" stroke-width="2.2"/><text x="540.0" y="515.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="540.0" dy="0">B2 SPEC-ML wrong prediction</tspan><tspan x="540.0" dy="1.25em">Person-recognition outputs</tspan><tspan x="540.0" dy="1.25em">too-low / wrong score</tspan><tspan x="540.0" dy="1.25em">(R-S02-1-P2)  ★ ML event</tspan></text>
<line x1="540" y1="364" x2="540" y2="490" stroke="#333" stroke-width="1.4"/>
<rect x="380" y="600" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="540.0" y="625.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="540.0" dy="0">B3 ASM-photo</tspan><tspan x="540.0" dy="1.25em">Search photo no longer</tspan><tspan x="540.0" dy="1.25em">resembles the child</tspan><tspan x="540.0" dy="1.25em">(R-S02-1-A4)</tspan></text>
<line x1="540" y1="364" x2="540" y2="600" stroke="#333" stroke-width="1.4"/>
<rect x="740" y="380" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="900.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="900.0" dy="0">C1 ASM-connectivity</tspan><tspan x="900.0" dy="1.25em">No Bluetooth/Wi-Fi/USB</tspan><tspan x="900.0" dy="1.25em">path in time</tspan><tspan x="900.0" dy="1.25em">(R-S02-1-A3)</tspan></text>
<line x1="900" y1="364" x2="900" y2="380" stroke="#333" stroke-width="1.4"/>
<rect x="740" y="490" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="900.0" y="515.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="900.0" dy="0">C2 SPEC-queue</tspan><tspan x="900.0" dy="1.25em">Queued report dropped</tspan><tspan x="900.0" dy="1.25em">before next radio session</tspan><tspan x="900.0" dy="1.25em">(R-S02-1-P4)</tspan></text>
<line x1="900" y1="364" x2="900" y2="490" stroke="#333" stroke-width="1.4"/>
<rect x="740" y="600" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="900.0" y="625.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="900.0" dy="0">C3 SPEC-payload</tspan><tspan x="900.0" dy="1.25em">Report lacks GPS/time/crop</tspan><tspan x="900.0" dy="1.25em">so it is not a sighting</tspan><tspan x="900.0" dy="1.25em">(R-S02-1-P3)</tspan></text>
<line x1="900" y1="364" x2="900" y2="600" stroke="#333" stroke-width="1.4"/>
<rect x="1100" y="380" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="1260.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="1260.0" dy="0">D1 SPEC-inbox</tspan><tspan x="1260.0" dy="1.25em">Coordinator drops the</tspan><tspan x="1260.0" dy="1.25em">report in a second pass</tspan><tspan x="1260.0" dy="1.25em">(R-S02-1-P5)</tspan></text>
<line x1="1260" y1="364" x2="1260" y2="380" stroke="#333" stroke-width="1.4"/>
<rect x="1100" y="490" width="320" height="92" rx="8" ry="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="1260.0" y="515.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222"><tspan x="1260.0" dy="0">D2 ASM-operator</tspan><tspan x="1260.0" dy="1.25em">Operators ignore the inbox</tspan><tspan x="1260.0" dy="1.25em">as noise</tspan><tspan x="1260.0" dy="1.25em">(R-S02-1-A5)</tspan></text>
<line x1="1260" y1="364" x2="1260" y2="490" stroke="#333" stroke-width="1.4"/>
<rect x="20" y="720" width="1400" height="40" rx="8" ry="8" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="720.0" y="740.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222"><tspan x="720.0" dy="0">Minimal cut sets (examples): {B2}; {C1}; {A1}; {D2}; {B3}; {C2}. A single basic event can violate R-S02-1.  ★ = required ML wrong-prediction event.</tspan></text>
</svg>
